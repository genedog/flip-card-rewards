<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>翻牌戳戳樂</title>
  <style>
    body {
      display: flex;
      justify-content: space-between;
      background: radial-gradient(circle, #fffde7, #ffecb3);
      font-family: '標楷體', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }

    .grid-row {
      display: flex;
      gap: 10px;
    }

    .card {
      width: 60px;
      height: 60px;
      background-color: #ffcc80;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.5s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .card.flipped {
      transform: rotateY(180deg);
      background-color: #ffe0b2;
    }

    .reward-container {
      width: 50%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: sparkle 3s infinite;
    }

    .reward-text {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .reward-img {
      max-width: 400px;
      max-height: 400px;
      border-radius: 20px;
      border: 5px solid #ffb74d;
      box-shadow: 0 0 20px #ff9800;
    }

    @keyframes sparkle {
      0% { background-color: #fff8e1; }
      50% { background-color: #fff3e0; }
      100% { background-color: #fff8e1; }
    }
  </style>
</head>

<body>
  <div class="grid-container" id="grid"></div>
  <div class="reward-container" id="reward">
    <div class="reward-text" id="rewardText"></div>
    <img class="reward-img" id="rewardImg" src="" alt="">
  </div>

  <audio id="flipSound" src="https://cdn.pixabay.com/download/audio/2022/03/26/audio_bfdcf8b3a1.mp3?filename=magic-coin-flip-144054.mp3"></audio>
  <audio id="clapSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5f71d055f3.mp3?filename=small-crowd-applause-143226.mp3"></audio>

  <script>
    const compliments = [
      "你太強了！連外星人都想拜你為師！",
      "你的聰明才智閃瞎我雙眼啦！",
      "天啊！這才是真正的天才級操作！",
      "你完成的速度快到讓光都羨慕！",
      "地球已經容不下你的優秀了！",
      "你的努力值100分，外加閃亮星星！",
      "老師感動得想請你喝珍奶了！",
      "這種表現根本可以上新聞啦！",
      "你的表現讓獅子都忍不住拍手！",
      "我快要跪下來膜拜你了啦！",
      "你的作業訂正得比教科書還完美！",
      "這麼棒的孩子，全宇宙獨一無二！",
      "我懷疑你偷偷開外掛！",
      "簡直是訂正界的傳奇！",
      "全班都該向你看齊！",
      "太扯了，根本就是學霸附身！",
      "光看你表現，我雞皮疙瘩都起來了！",
      "完美！找不到一點缺點！",
      "老師想頒發一座獎杯給你！",
      "表現太神了，我要 screenshot 留念！",
      "天花板都被你撐破了！",
      "完美命中訂正神技！",
      "超越人類極限的訂正能力！",
      "每個錯誤在你眼裡都是浮雲！",
      "你已經是訂正界的 MVP 了！",
      "這不是訂正，這是藝術！",
      "訂正天才，歡迎登場！",
      "這麼棒的孩子我想收藏起來！",
      "你不只是完成了訂正，還征服了它！",
      "請受我一拜，訂正大師！"
    ];

    const rewardImages = [
      "https://i.imgur.com/kWRxD7Y.jpeg",
      "https://i.imgur.com/MsN4jiX.jpeg",
      "https://i.imgur.com/NuS7ATr.jpeg",
      "https://i.imgur.com/4nqI3Bo.jpeg",
      "https://i.imgur.com/KIrHYKc.jpeg",
      "https://i.imgur.com/EvYDw9k.jpeg",
      "https://i.imgur.com/9Wfn4CK.jpeg",
      "https://i.imgur.com/B80Ad3j.jpeg",
      "https://i.imgur.com/MkDzPiF.jpeg",
      "https://i.imgur.com/R4npvVN.jpeg",
      "https://i.imgur.com/QKItwqu.jpeg",
      "https://i.imgur.com/1Alr2Sa.jpeg",
      "https://i.imgur.com/qD06f5D.jpeg",
      "https://i.imgur.com/kxCjAXh.jpeg",
      "https://i.imgur.com/tghF2T1.jpeg",
      "https://i.imgur.com/IK8ip3I.jpeg",
      "https://i.imgur.com/KnRQzJ5.jpeg",
      "https://i.imgur.com/fO9D2h6.jpeg",
      "https://i.imgur.com/wZ3f6U7.jpeg",
      "https://i.imgur.com/0rIzKJz.jpeg",
      "https://i.imgur.com/yQItAAz.jpeg",
      "https://i.imgur.com/PhV2J0w.jpeg",
      "https://i.imgur.com/yzS3tvm.jpeg",
      "https://i.imgur.com/sfEZPIS.jpeg",
      "https://i.imgur.com/s40Zz7V.jpeg",
      "https://i.imgur.com/pFSYTOi.jpeg",
      "https://i.imgur.com/8cJx6Zf.jpeg",
      "https://i.imgur.com/M1hfI7X.jpeg",
      "https://i.imgur.com/f3ZToMf.jpeg",
      "https://i.imgur.com/fneStnR.jpeg"
    ];

    const grid = document.getElementById("grid");
    const rewardText = document.getElementById("rewardText");
    const rewardImg = document.getElementById("rewardImg");
    const flipSound = document.getElementById("flipSound");
    const clapSound = document.getElementById("clapSound");

    let used = new Set();

    for (let r = 0; r < 3; r++) {
      const row = document.createElement("div");
      row.className = "grid-row";
      for (let c = 1; c <= 10; c++) {
        const num = r * 10 + c;
        const card = document.createElement("div");
        card.className = "card";
        card.textContent = num;
        card.addEventListener("click", () => {
          if (used.has(num)) return;
          used.add(num);
          card.classList.add("flipped");
          const compliment = compliments[num - 1];
          const img = rewardImages[num - 1];
          rewardText.textContent = compliment;
          rewardImg.src = img;
          flipSound.play();
          setTimeout(() => clapSound.play(), 800);
        });
        row.appendChild(card);
      }
      grid.appendChild(row);
    }
  </script>
</body>

</html>
